[project]
name = "friis-backend"
version = "0.1.0"
description = "Finance Risk & Investment Intelligence System API"
readme = "README.md"

# Project is pinned to Python 3.12
requires-python = ">=3.12,<3.13"

dependencies = [
    # ============================================================
    # Web Framework
    # ============================================================
    "fastapi==0.121.0",
    "uvicorn[standard]==0.38.0",
    "starlette>=0.40.0,<0.50.0",
    "python-multipart==0.0.20",
    # ============================================================
    # Configuration & Validation
    # ============================================================
    "python-dotenv==1.2.1",
    "pydantic==2.12.4",
    # ============================================================
    # HTTP / External APIs
    # ============================================================
    "httpx>=0.27.0",
    # ============================================================
    # LlamaIndex Retrieval
    # ============================================================
    "llama-index-core>=0.14.3,<0.15",
    "llama-index-retrievers-bm25>=0.7.1,<0.8",
    # ============================================================
    # OpenAI
    # Keep OpenAI 1.x for this dependency stack
    # ============================================================
    "openai>=1.81.0,<2.0.0",
    # ============================================================
    # LangChain / PostgreSQL
    # ============================================================
    "langchain-community==0.4.1",
    "langchain-core>=1.0.1,<2.0.0",
    "langchain-openai==1.0.0",
    "langchain-postgres==0.0.16",
    "langchain-text-splitters==1.0.0",
    "langgraph>=1.2.20,<2.0.0",
    # ============================================================
    # Langfuse - Evaluation / Observability
    # ============================================================
    "langfuse>=5,<6",
    # ============================================================
    # PostgreSQL / pgvector
    # ============================================================
    "sqlalchemy>=2.0.45",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.2.0",
    # ============================================================
    # Multi-format Document Processing
    # ============================================================
    # PDF
    "pypdf==6.2.0",
    "pymupdf==1.24.0",
    # HTML
    "beautifulsoup4==4.14.2",
    # TXT uses Python built-in file handling
    # ============================================================
    # Guardrails / PII Detection
    # ============================================================
    # 0.11.0 requires OpenAI 2.x, so use 0.10.2 with OpenAI 1.x.
    "guardrails-ai==0.10.2",
    "guardrails-ai-detect-pii==0.0.6",
    "presidio-analyzer>=2.2.360,<3",
    "presidio-anonymizer>=2.2.360,<3",
    # ============================================================
    # Authentication
    # ============================================================
    "python-jose[cryptography]>=3.3.0",
]


# ================================================================
# Development Dependencies
# ================================================================

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]


# ================================================================
# UV Configuration
# ================================================================

[tool.uv]
package = false


# ================================================================
# Pytest Configuration
# ================================================================

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = ".test-cache"
verbosity_test_cases = 1
filterwarnings = [
    'ignore:This package \(llama-cloud-services\) is deprecated.*:DeprecationWarning:llama_parse',
    "ignore:The 'is_flag' and 'flag_value' parameters are not supported by Typer.*:DeprecationWarning:typer.params",
]

[tool.coverage.report]
fail_under = 80
show_missing = false
